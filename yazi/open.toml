[opener]
edit = [
	{ run = '$EDITOR "$@"', desc = "$EDITOR", block = true, for = "unix" },
	{ run = 'nvim "%*"', desc = "nvim", block = true, for = "windows" },
]

[open]
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ name = "*.go", use = "edit" },
	{ name = "*.mod", use = "edit" },
	{ name = "*.sum", use = "edit" },
	{ name = "*.lua", use = "edit" },
	{ name = "*.toml", use = "edit" },
	{ name = "*.yaml", use = "edit" },
	{ name = "*.yml", use = "edit" },
	{ name = "*.json", use = "edit" },
	{ name = "*.md", use = "edit" },
]
